[project]
name = "proposer-llm"
dynamic = ["version"]
description = "Assistants that read and propose but never act: a framework for describing what a pipeline should build"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "David Oluwasusi" }]
keywords = ["llm", "agents", "tool-calling", "data-ingestion", "pipelines", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "openpyxl>=3.1",     # supplementary .xlsx tables
  "pydantic>=2.7",
  "pypdf>=5",          # papers as PDF
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
tooluniverse = ["tooluniverse"]     # to run ToolUniverse tools pinned by a pack

[project.urls]
Repository = "https://github.com/daviddamilola/proposer"
Issues = "https://github.com/daviddamilola/proposer/issues"

[project.scripts]
proposer = "proposer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proposer/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/proposer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741"]
